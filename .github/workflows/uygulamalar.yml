name: Uygulama listesini güncelle

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python araclar/uygulamalar_guncelle.py
      - name: Değişiklik varsa kaydet
        run: |
          if [ -n "$(git status --porcelain uygulamalar.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uygulamalar.json
            git commit -m "Uygulama listesi güncellendi"
            git push
          fi
